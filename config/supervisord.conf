[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# ── 1. Xvfb virtual display ───────────────────────────────────────────────────
[program:xvfb]
command=Xvfb :99 -screen 0 %(ENV_RESOLUTION)sx24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

# ── 2. Openbox window manager ─────────────────────────────────────────────────
[program:openbox]
command=openbox --config-file /root/.config/openbox/rc.xml
environment=DISPLAY=":99",HOME="/root"
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/openbox.log
stderr_logfile=/var/log/supervisor/openbox.log

# ── 3. x11vnc VNC server ─────────────────────────────────────────────────────
[program:x11vnc]
command=x11vnc -display :99 -nopw -listen 0.0.0.0 -xkb -forever -shared -rfbport 5900 -noxdamage
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

# ── 4. noVNC websocket proxy ──────────────────────────────────────────────────
[program:novnc]
command=/opt/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 8080
autorestart=true
priority=40
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log

# ── 5. ROS master ─────────────────────────────────────────────────────────────
[program:roscore]
command=bash -c "source /opt/ros/noetic/setup.bash && roscore"
environment=HOME="/root",ROS_MASTER_URI="http://localhost:11311"
autorestart=true
priority=50
stdout_logfile=/var/log/supervisor/roscore.log
stderr_logfile=/var/log/supervisor/roscore.log

# ── 6. Desktop xterm (always open) ───────────────────────────────────────────
[program:xterm]
command=xterm -fa 'Monospace' -fs 11 -bg '#1e1e1e' -fg '#d4d4d4' -geometry 120x38+10+10 -title "UAV Sim Terminal"
environment=DISPLAY=":99",HOME="/root"
autorestart=true
priority=70
stdout_logfile=/var/log/supervisor/xterm.log
stderr_logfile=/var/log/supervisor/xterm.log
